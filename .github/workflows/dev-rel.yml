name: Dev Release

on:
  push:
    tags:
      - "[0-9][0-9]w[0-9][0-9]*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^[0-9]{2}w[0-9]{2}[a-z]*$ ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match YYwWW[a-z]*"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare release notes
        run: |
          awk '
            /^## / {
              if (section) {
                exit
              }
              section = 1
            }
            section { print }
          ' CHANGELOG.md > release-notes.md

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build -p switchyard --release

      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/switchyard dist/switchyard-linux-x86_64
          tar -C dist -czf dist/switchyard-linux-x86_64.tar.gz switchyard-linux-x86_64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/switchyard-linux-x86_64.tar.gz
          body_path: release-notes.md
          generate_release_notes: true
